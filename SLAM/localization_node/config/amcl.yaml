amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0

    # Mecanum robot = omnidirectional motion model.
    # If AMCL complains about this value, replace with:  "omnidirectional"
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: -1.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    update_min_d: 0.10        # filter update after 10 cm of movement
    update_min_a: 0.10        # ... or ~6 degrees of turning
    set_initial_pose: false   # the localize helper sends the start pose
    always_reset_initial_pose: false
    save_pose_rate: 0.5
