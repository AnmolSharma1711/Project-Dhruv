# =============================================================================
# Nav2 parameters - nav package (ROS 2 Humble, Jetson Orin Nano)
# Robot: 4-wheel mecanum driven ONLY forward/backward + pivot (never sideways).
# Localization (map server + AMCL) is run by the separate localization_node.
#
# MEASURED calibration (power 180 = app full speed):
#   top speed 0.148 m/s forward, ~2.28 rad/s turn, slowest usable power 25
#   -> slowest usable forward ~0.02 m/s, slowest usable turn ~0.32 rad/s
#
# odom_topic and robot_radius below are DEFAULTS. The launch file overrides them
# from the launch arguments `odom_topic` and `robot_radius` (single source of truth).
# =============================================================================

# ---------------------------------------------------------------------------
# BT Navigator
# ---------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.5          # slow Jetson: be lenient with TF timing
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: 'nav2_bt_navigator/NavigateToPoseNavigator'
    navigate_through_poses:
      plugin: 'nav2_bt_navigator/NavigateThroughPosesNavigator'
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

# ---------------------------------------------------------------------------
# Planner Server - NavFn with A*
# ---------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ['GridBased']
    GridBased:
      plugin: 'nav2_navfn_planner/NavfnPlanner'
      tolerance: 0.15            # m; was 0.3 (too loose for exact checkpoints)
      use_astar: true
      allow_unknown: false       # the saved map has gaps in the walls and unknown space
                                 # outside: the planner must never route through them

# ---------------------------------------------------------------------------
# Controller Server - Regulated Pure Pursuit (differential-style: forward + pivot)
# NOTE: RPP never outputs linear.y, so the robot never strafes.
# ---------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odometry/filtered   # WAS MISSING: controller defaulted to /odom (does not exist)
    controller_frequency: 10.0       # 20 Hz caused "missed desired rate" on the Jetson
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: 'progress_checker'
    goal_checker_plugins: ['general_goal_checker']
    controller_plugins: ['FollowPath']

    progress_checker:
      plugin: 'nav2_controller::SimpleProgressChecker'
      required_movement_radius: 0.05
      movement_time_allowance: 25.0

    general_goal_checker:
      plugin: 'nav2_controller::SimpleGoalChecker'
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20       # ~11.5 deg
      stateful: true

    FollowPath:
      plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController'
      desired_linear_vel: 0.14       # robot top speed is 0.148 m/s (measured)
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05   # ~61 power, above the 25 power deadband
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      # The robot can pivot: turn to face the path at the start and turn to the
      # checkpoint's saved heading at the end (was false -> never reached the yaw goal)
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.5   # 0.5 rad/s ~ 39 power (min usable 0.32 rad/s)
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
      transform_tolerance: 0.5

# ---------------------------------------------------------------------------
# Behavior Server (recoveries). Spin is REQUIRED: the default behavior tree calls it.
# ---------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ['spin', 'backup', 'drive_on_heading', 'wait']
    spin:
      plugin: 'nav2_behaviors/Spin'
    backup:
      plugin: 'nav2_behaviors/BackUp'
    drive_on_heading:
      plugin: 'nav2_behaviors/DriveOnHeading'
    wait:
      plugin: 'nav2_behaviors/Wait'
    local_frame: odom
    global_frame: odom               # Humble checks behavior poses against the local odom grid
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4          # above the 0.32 rad/s motor deadband
    rotational_acc_lim: 1.0

# ---------------------------------------------------------------------------
# Global Costmap
# The LiDAR is mounted 0.625 m high, so low obstacles below that are INVISIBLE.
# ---------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.13             # TODO: verify by measuring (centre to outer edge)
      resolution: 0.05
      track_unknown_space: true
      plugins: ['static_layer', 'obstacle_layer', 'inflation_layer']

      static_layer:
        plugin: 'nav2_costmap_2d::StaticLayer'
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: 'nav2_costmap_2d::ObstacleLayer'
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: 'LaserScan'
          inf_is_valid: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.10   # do not mark the robot's own body

      inflation_layer:
        plugin: 'nav2_costmap_2d::InflationLayer'
        cost_scaling_factor: 3.0
        inflation_radius: 0.30       # was 0.18 (5 cm margin); AMCL checks differed 6-27 cm

      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# Local Costmap (2D LiDAR -> plain ObstacleLayer, voxels are pointless)
# ---------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.13             # TODO: verify by measuring (centre to outer edge)
      resolution: 0.05
      rolling_window: true
      width: 3
      height: 3
      plugins: ['obstacle_layer', 'inflation_layer']

      obstacle_layer:
        plugin: 'nav2_costmap_2d::ObstacleLayer'
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: 'LaserScan'
          inf_is_valid: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.10

      inflation_layer:
        plugin: 'nav2_costmap_2d::InflationLayer'
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# Velocity Smoother. y limits are 0 = no sideways motion, ever.
# ---------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: 'OPEN_LOOP'
    max_velocity: [0.14, 0.0, 0.8]
    min_velocity: [-0.14, 0.0, -0.8]
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.3, 0.0, -1.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
